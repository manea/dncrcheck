services:
  dncrcheck:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dncrcheck
    restart: unless-stopped
    ports:
      - "127.0.0.1:4231:4231"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4231
      DNCRCHECK_DATA_DIR: /app/data
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - dncrcheck_data:/app/data

volumes:
  dncrcheck_data:
